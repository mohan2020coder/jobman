services:
  postgres:
    image: postgres:16-alpine
    container_name: jobman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_app
    ports:
      - "5433:5432"
    volumes:
      - jobman-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobman-pgdata: